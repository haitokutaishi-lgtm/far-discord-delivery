name: FAR diagram Discord deliver

on:
  schedule:
    # Wed & Sat 12:00 JST = 03:00 UTC
    - cron: "0 3 * * 3"
    - cron: "0 3 * * 6"
  workflow_dispatch:

concurrency:
  group: far-deliver
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Deliver next approved row
        env:
          GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_ERROR_WEBHOOK_URL: ${{ secrets.DISCORD_ERROR_WEBHOOK_URL }}
          DISCORD_THREAD_ID: ${{ secrets.DISCORD_THREAD_ID }}
          DISCORD_ERROR_THREAD_ID: ${{ secrets.DISCORD_ERROR_THREAD_ID }}
          SHEET_NAME: ${{ vars.SHEET_NAME }}
        run: python scripts/deliver.py
